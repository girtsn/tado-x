# General-purpose Heating dashboard for tado X.
# No Vaillant, myPyllant or particular home's installed radiator inventory.
# The three core cards are served by the public tado integration.
title: Heating
views:
  - title: Overview
    path: overview
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heating flow and hot water
            heading_style: title
            icon: mdi:heating-coil
          - type: custom:tado-x-settings-history-card
            title: Heating flow, hot water and outdoor temperature
            # Optional weather sensor override:
            # outdoor_entity: sensor.outdoor_temperature
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Heating controls
            heading_style: title
            icon: mdi:home-thermometer
          - type: markdown
            content: |-
              **Whole-home tado X heating actions**

              - Heating Off: enter frost protection
              - Resume Schedules: restore room schedules
                and automatic flow adaptation
              - Eco Boost: 30-minute maximum room heating
                with automatic flow adaptation enabled
              - Top Boost: 30-minute maximum room heating
                with automatic flow adaptation temporarily off

              Both boosts have a restart-safe recovery deadline.
              The mode indicator compares saved actions with
              the currently reported room schedule status.

              Temperature limits are targets and calculations,
              not actual measured boiler outlet temperature.
            grid_options:
              columns: full
  - title: Schedules
    path: schedules
    icon: mdi:calendar-clock
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Room heating programmes
            heading_style: title
            icon: mdi:calendar-clock
          - type: custom:tado-x-schedule-card
            title: tado X weekly room schedules
            grid_options:
              columns: full
          - type: markdown
            content: >-
              All room schedule controls use tado X APIs.
              Changes to programmes are sent only when saved.
              Room-level schedule status is also available
              as standard Home Assistant sensors.
            grid_options:
              columns: full
