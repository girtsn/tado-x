name: Publish validated tado X release

on:
  workflow_run:
    workflows: ["Validate tado X HOPS controls and heating allocation"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish validated HACS release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ "$VALIDATED_SHA" != "$current_sha" ]]; then
            echo "Skipping stale validated commit $VALIDATED_SHA; master is $current_sha"
            exit 0
          fi
          VERSION=$(python -c "import json; print(json.load(open('custom_components/tado/manifest.json'))['version'])")
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{1,2}$ ]]; then
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$VALIDATED_SHA" \
            --title "tado X v$VERSION" \
            --notes-file "RELEASE_NOTES_$VERSION.md"
