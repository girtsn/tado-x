set_climate_timer:
  target:
    entity:
      integration: tado
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: "°"
    time_period:
      required: false
      example: "01:30:00"
      selector:
        text:
    requested_overlay:
      required: false
      example: "MANUAL"
      selector:
        select:
          options:
            - "NEXT_TIME_BLOCK"
            - "MANUAL"
            - "TADO_DEFAULT"

set_water_heater_timer:
  target:
    entity:
      integration: tado
      domain: water_heater
  fields:
    time_period:
      required: true
      example: "01:30:00"
      default: "01:00:00"
      selector:
        text:
    temperature:
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: "°"

set_climate_temperature_offset:
  target:
    entity:
      integration: tado
      domain: climate
  fields:
    offset:
      default: 0
      selector:
        number:
          min: -10
          max: 10
          step: 0.01
          unit_of_measurement: "°"

add_meter_reading:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: tado
    reading:
      required: true
      selector:
        number:
          mode: box
          min: 0
          step: 1


x_list_rooms:
  name: List tado X rooms
  description: Return room names and room IDs from the current tado cache. No cloud calls.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_get_schedule:
  name: Read a tado X weekly room schedule
  description: On-demand HOPS GET. Returns seven days and conflict-prevention signatures.
  fields:
    room_id:
      required: true
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_save_day:
  name: Save one tado X room schedule day
  description: Re-read, compare signed snapshot, POST one day, and verify by readback.
  fields:
    room_id:
      required: true
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    day:
      required: true
      selector:
        select:
          options:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
    blocks:
      required: true
      description: 'Complete day as list of start/end HH:MM, power ON/OFF and temperature when ON.'
      selector:
        object:
    expected_signature:
      required: true
      selector:
        text:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_get_settings:
  name: Read tado X DHW and flow settings
  description: Two on-demand HOPS GET requests; returns raw setting structures.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_set_dhw_temperature:
  name: Set tado X hot-water temperature
  description: Uses HOPS domesticHotWater/manualControl. This is a manual setpoint, not a permanent scheduled programme.
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 35
          max: 70
          step: 1
          unit_of_measurement: "°C"
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_boost_dhw:
  name: Boost or stop tado X domestic hot water
  fields:
    boost:
      required: true
      selector:
        select:
          options:
            - "ON"
            - "OFF"
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_resume_dhw:
  name: Resume tado X hot-water schedule
  description: Resume the programmer's native schedule if supported; for this home its weekly endpoint returned 404.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_set_flow:
  name: Change tado X maximum flow temperature and automatic optimisation
  description: Patch only the specified settings. These are configuration values, not measured boiler flow temperatures.
  fields:
    max_temperature:
      required: false
      selector:
        number:
          min: 20
          max: 75
          step: 1
          unit_of_measurement: "°C"
    auto_adaptation:
      required: false
      selector:
        boolean:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_compute_heating_allocation:
  name: Compute estimated gas input allocated to tado rooms
  description: Local Recorder only. Uses myPyllant Gas Heating hourly Wh and tado room mean heating demand. Publishes separate tado external kWh statistics; does NOT alter source statistics.
  fields:
    days:
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 35
          mode: box
    dry_run:
      required: false
      default: false
      selector:
        boolean:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_heating_allocation_history:
  name: Read per-room heating gas for a calendar date range
  description: >-
    Read-only Vaillant-based room gas estimates in local Home Assistant calendar
    time. Supply both inclusive start_date and end_date (YYYY-MM-DD) to request
    an exact period, including 23/25-hour DST dates. Day and short ranges use
    true hourly Recorder allocation rows; years and 3-year ranges use monthly
    summaries with hourly partial-month boundaries. No source data is modified.
    If dates are omitted, the legacy rolling-period behaviour is preserved.
  fields:
    period:
      required: false
      default: month
      selector:
        select:
          options:
            - day
            - week
            - month
            - year
            - 3years
            - custom
    start_date:
      required: false
      description: Inclusive Brussels-local start day, e.g. 2026-11-01.
      selector:
        date:
    end_date:
      required: false
      description: Inclusive Brussels-local end day, e.g. 2026-11-07.
      selector:
        date:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_radiator_capacity_report:
  name: Review installed radiator outputs and tado room mapping
  description: >-
    Read-only comparison of the 11 physical radiator IDs R01-R11 with the 10 tado
    rooms, showing EN442 75/65/20 rated watts, totals per room, manual
    overrides and unmatched/mismatched rooms. No cloud calls.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_apply_radiator_capacities:
  name: Apply installed radiator rated output to room weights
  description: >-
    Persist safely matched EN442 rated capacities as local Home Assistant
    room weighting numbers. By default previews only, and preserves
    existing manual overrides. Never changes tado heating schedules,
    boiler configuration or Vaillant source statistics.
  fields:
    dry_run:
      required: false
      default: true
      selector:
        boolean:
    overwrite_existing:
      required: false
      default: false
      selector:
        boolean:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_assign_radiator_room:
  name: Assign physical radiator room to a tado X room ID
  description: >-
    Set or clear an explicit tado-room-to-physical-radiator group mapping,
    using the room IDs returned by tado.x_list_rooms. Radiator IDs R01–R11
    are physical radiators and are not tado room IDs. A group such as
    attic_bedroom includes R09 and R10 automatically. This changes only
    Home Assistant's locally stored allocation weights.
  fields:
    room_id:
      required: true
      selector:
        number:
          min: 1
          max: 2147483647
          mode: box
    physical_room:
      required: true
      selector:
        select:
          options:
            - auto
            - living
            - entrance
            - kitchen
            - toilet
            - yard_bedroom
            - street_bedroom
            - small_bedroom
            - bathroom_1fl
            - attic_bedroom
            - attic_bathroom
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_diagnose_unallocated_heating:
  name: Diagnose unallocated heating gas
  description: >-
    Read-only 1–35 day Recorder analysis explaining why Vaillant gas-heating
    input was not assigned to tado X heating rooms. Separates missing or
    invalid room demand measurements from hours where all tado rooms report
    zero demand, ranks affected dates and highest-energy hours, and checks
    adjacent-hour room activity as a clue to timing. Does not edit
    consumption statistics, radiator weights or cloud/boiler controls.
  fields:
    days:
      required: false
      default: 35
      selector:
        number:
          min: 1
          max: 35
          step: 1
          mode: box
    limit:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_heating_quick_action:
  name: Whole-home tado X heating mode
  description: >-
    All actions affect all tado X heating rooms, not domestic hot water.
    'off' applies frost protection and cancels any boost timer. 'resume'
    cancels manual overrides, resumes room schedules and ENSURES automatic
    flow-temperature adaptation is enabled. 'eco_boost' enables adaptation
    and boosts all rooms for 30 minutes. 'top_boost' temporarily disables
    adaptation and boosts all rooms for 30 minutes, then resumes schedules
    and restores adaptation. BOTH boost deadlines persist across Home
    Assistant restarts and failed recoveries retry every five minutes.
    Legacy 'boost' is an alias for 'eco_boost'. Home Assistant must be
    running and connected to tado to perform recovery; an extended outage
    can delay restoration until HA comes back. Native tado boost still has
    its own 30-minute timeout. Writes use experimental HOPS endpoints.
    No change is made without an explicit call, except a previously
    requested, persistently scheduled recovery.
  fields:
    action:
      required: true
      selector:
        select:
          options:
            - label: Heating Off (all rooms, frost protection)
              value: "off"
            - label: Resume Schedules + enable adaptive flow
              value: resume
            - label: Eco Boost — maximum room heat for 30m, adaptive enabled
              value: eco_boost
            - label: Top Boost — maximum room heat for 30m, adaptive disabled
              value: top_boost
            - label: Legacy Boost (same as Eco Boost)
              value: boost
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_heating_mode_status:
  name: Show last Home Assistant heating mode and persisted recovery
  description: >-
    Read local mode persistence and any scheduled boost recovery without
    making cloud requests. Shows last mode requested through HA, not a
    confirmed state from tado; direct app or valve changes are not tracked.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado

x_room_schedule_status:
  name: Show tado X room schedules and manual overrides
  description: >-
    Read only. Uses the cached tado X room states polled by the existing
    integration. Reports for every room whether Smart Schedule is active,
    whether manual control is overriding it (including manual Off),
    the override termination type and the inferred current home heating
    mode. One room can contain multiple radiator valves. This does not
    call the cloud or modify a heating setting.
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: tado
