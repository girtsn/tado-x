# Single tado X Heating dashboard for everyone.
# General controls need no options. Household Vaillant heating consumption
# appears as a section ONLY if the optional energy feature is enabled.
# Home Assistant does not support state-conditional top-level view tabs.
# If the binary sensor's entity ID was customized, update the one
# 'visibility' condition below to its actual entity ID.
title: Heating
views:
  - title: Overview
    path: overview
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heating flow and hot water
            heading_style: title
            icon: mdi:heating-coil
          - type: custom:tado-x-settings-history-card
            title: Heating flow, hot water and outside temperature
            # Optional override:
            # outdoor_entity: sensor.outdoor_temperature
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Whole-home heating controls
            heading_style: title
            icon: mdi:home-thermometer
          - type: markdown
            content: |-
              **Included for all tado X users**

              Heating Off enters frost protection.
              Resume Schedules cancels room overrides and restores
              automatic flow adaptation.

              Eco Boost requests 30 minutes of maximum room heating
              with adaptation enabled. Top Boost also temporarily
              disables flow adaptation. Both have restart-safe recovery.

              The current mode and schedule/manual room overrides
              are shown in the heating flow card.
            grid_options:
              columns: full

      # This ENTIRE section is conditional, including its heading.
      # The read-only binary sensor mirrors the ONE optional integration
      # checkbox: Vaillant/myPyllant household energy allocation.
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.tado_x_vaillant_energy_enabled
            state: "on"
        cards:
          - type: heading
            heading: Vaillant heating consumption by room
            heading_style: title
            icon: mdi:fire
          - type: custom:tado-x-heating-energy-card
            title: Estimated heating gas input by room
            grid_options:
              columns: full
          - type: markdown
            content: |-
              **Optional household energy model**

              Gas-heating input from myPyllant is allocated using
              each room's recorded tado X heating demand and the
              installed radiators' configured EN442 capacities.

              Historic Vaillant hourly values derived by evenly
              spreading daily totals are provisional for room
              allocation. These estimates are not measurements of
              heat delivered by individual radiator valves.
            grid_options:
              columns: full

  - title: Schedules
    path: schedules
    icon: mdi:calendar-clock
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: tado X weekly heating schedules
            heading_style: title
            icon: mdi:calendar-clock
          - type: custom:tado-x-schedule-card
            title: Room schedule editor
            grid_options:
              columns: full
          - type: markdown
            content: >-
              Room schedules, save and copy functions, and manual-override
              detection are supported by tado X independently of Vaillant.
            grid_options:
              columns: full
