name: Validate tado X HOPS controls and heating allocation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/tado tests
      - name: Offline API and consumption tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate dashboard JavaScript syntax
        run: |
          for script in custom_components/tado/www/*.js; do
            node --input-type=module --check < "$script"
          done
      - name: Test dashboard loader and hot-swap logic
        run: node tests/test_frontend_loader.cjs
      - name: Test interactive chart tooltip
        run: node tests/test_chart_hover_tooltip.cjs custom_components/tado/www/x-chart-hover-tooltip.js
      - name: Test categorical presence history
        run: node tests/test_presence_history.cjs
      - name: Validate manifest and JSON translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('custom_components/tado')
          manifest=json.loads((base/'manifest.json').read_text())
          assert manifest['domain']=='tado'
          import re
          assert re.fullmatch(r'\\d{4}\\.\\d{2}\\.\\d{1,2}', manifest['version'])
          json.loads((base/'strings.json').read_text())
          json.loads((base/'translations/en.json').read_text())
          PY
