title: Heating
views:
  - title: Overview
    path: overview
    icon: mdi:home-thermometer
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heating flow and hot water
            heading_style: title
            icon: mdi:heating-coil
          - type: custom:tado-x-settings-history-card
            title: Heating flow, hot water and outdoor temperature
            # Optional: choose a particular outdoor sensor below.
            # outdoor_entity: sensor.your_outdoor_temperature
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: System overview
            heading_style: title
            icon: mdi:radiator
          - type: markdown
            content: |-
              **Whole-home quick actions**

              The card lets you turn heating off (frost protection),
              resume all room Smart Schedules or boost all rooms for
              30 minutes. These actions do not control hot water.

              **Radiator inventory:** 11 in 10 heating rooms;
              25.748 kW EN442 nominal output.
              Attic bedroom has two radiators, 6.538 kW total.

              Calculated tado flow limits are not measured boiler flow.
            grid_options:
              columns: full

  - title: Consumption
    path: consumption
    icon: mdi:chart-line
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heating gas allocated to rooms
            heading_style: title
            icon: mdi:fire
          - type: custom:tado-x-heating-energy-card
            title: Estimated heating gas input by room
            grid_options:
              columns: full
          - type: markdown
            content: |-
              **Historical data caveat:** Vaillant's older daily gas
              backfill was divided into equal hourly buckets. Historical
              room allocations from before 3 November 2026 are provisional,
              until a separate daily-weighted allocation is available.

              The room kWh values are modelled shares of gas *input*,
              not direct measurements of radiator heat delivered.
            grid_options:
              columns: full

  - title: Schedules
    path: schedules
    icon: mdi:calendar-clock
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Weekly heating schedules
            heading_style: title
            icon: mdi:calendar-clock
          - type: custom:tado-x-schedule-card
            title: tado X room schedule editor
            grid_options:
              columns: full
          - type: markdown
            content: >-
              Edit, copy and save weekly room time blocks. Saved changes
              are verified against tado. Whole-home Resume Schedule cancels
              manual room overrides; it does not rewrite your programmes.
            grid_options:
              columns: full
