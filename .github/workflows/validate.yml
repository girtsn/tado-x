name: Validate tado X HOPS controls and heating allocation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/tado tests
      - name: Offline API and consumption tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check custom_components/tado/www/tado-x-schedule-card.js
          node --check custom_components/tado/www/tado-x-heating-energy-card.js
          node --check custom_components/tado/www/tado-x-settings-history-card.js
      - name: Validate manifest and JSON translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('custom_components/tado')
          manifest=json.loads((base/'manifest.json').read_text())
          assert manifest['domain']=='tado'
          assert manifest['version']=='2026.11.9'
          json.loads((base/'strings.json').read_text())
          json.loads((base/'translations/en.json').read_text())
          PY
